name: Restaurant Docker Test & Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ] 

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      APP_PORT: 8080
    steps:
      - name: 1. Download Restaurant Code
        uses: actions/checkout@v4

      - name: 2. Build the Docker Image in the Cloud
        run: docker build -t restaurant-app:latest .
      - name: 3. Start the container 
        run: docker run -d -p $APP_PORT:80 --name test-web restaurant-app:latest

      - name: 4. Varify website is Alive with curl 
        run: |
          sleep 2 
          curl -I http://localhost:$APP_PORT
   
      - name: 5. Upload Website Files as Artifact 
        uses: actions/upload-artifact@v4
        with:
           name: craver-production-files
           path: | 
             *.html
             css/
             js/



# Job 2: Deploy to staging (It will run on new VM in cloud)

  deploy-to-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: 1. Download Artifacts from Job 1
        uses: actions/download-artifact@v4
        with:
          name: craver-production-files
      - name: 2. Inspect Downloaded Files in Fresh VM 
        run: | 
          echo "=== Files successfully received from job 1 ==="
          ls -la
      - name: 3. Simulated Deployment
        run: echo " Website Successfully deployed to staging server!"
      - name: 4. Test secret masking
        env:
          SECRET_VAL: ${{ secrets.MY_TEST_SECRET }}
        run: |
          echo "Attempting to print secret: $SECRET_VAL"

