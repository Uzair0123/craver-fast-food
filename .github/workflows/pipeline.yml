name: Craver Fastfood Enterprise Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    env:
      APP_PORT: 8080
    steps:
      - name: 1. Clone Restaurant code into cloud VM
        uses: actions/checkout@v4

      - name: "2. Gate 1: Code Sanity & File Integrigy Check"
        run: | 
          echo "=== Running Gate 1: File Integrity checks ==="
          test -f index.html || (echo "ERROR: index.html missing!"&& exit 1 )
          test -f Dockerfile || (echo "ERROR: Dockerfile missing!" && exit 1 )
          echo "Gate 1 PASSED: Core files are healthy!"

      - name: 3. Build Docker Image in Cloud
        run: docker build -t craver-restaurant:latest . 



      - name: "4. Gate 2 : Trivy Continer Vulnerability Scan (CVEs)"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'craver-restaurant:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'



      - name: "5. Start Container in Backgroud"
        run: docker run -d -p $APP_PORT:80 --name test-restaurant craver-restaurant:latest

      - name: "6. Gate 3: Live Http smoke test"
        run: | 
          sleep 2
           curl -I http://localhost:$APP_PORT

      - name: "7. Upload Production Website Artifacts"
        uses: actions/upload-artifact@v4
        with: 
          name: craver-production-files
          path: |
            *.html
            css/
            js/
            assets/

  production-deployment:
    needs: test-and-security
    runs-on: ubuntu-latest
    steps:
      - name: "1. Download Production Artifacts from job 1"
        uses: actions/download-artifact@v4
        with:
          name: craver-production-files

      - name: "2. Inspect Downloaded Files in Brand new VM"
        run: | 
          echo "=== Verifying Files Handed over from cloud Locker ==="
          ls -la

      - name: "3. Enterprise Secret Injection & Masking Guard"
        env:
          DEPLOY_KEY: ${{ secrets.MY_TEST_SECRET }}
        run: | 
          echo "=== Testing Deploying Authentication ==="
          echo "Authorizing staging deployment with key:$DEPLOY_KEY"
      - name: "4. Strategy A: Rolling Update Simulation (Zero-Downtime)"
        run: |

          # 1. Start tow real containers (v1)
          docker run -d -p 8081:80 --name replica-1 craver-restaurant:latest
          docker run -d -p 8082:80 --name replica-2 craver-restaurant:latest 
          sleep 2

          # 2. Update Replica 1 (Stop old, start new on same port 8081)
          docker stop replica-1 && docker rm replica-1
          docker run -d -p 8081:80 --name replica-1 craver-restaurant:latest
          sleep 2
          curl -I http://localhost:8081 # <---Real System output!

          # 3. Update Replica 2 (stop 9ld, start new on same port 8082)
          docker stop replica-2 && docker rm replica-2
          docker run -d -p 8082:80 --name replica-2 craver-restaurant:latest
          sleep 2
          curl -I http://localhost:8082 
          # 4. Clean up containers
          docker stop replica-1 replica-2 && docker rm replica-a1 replica-2

