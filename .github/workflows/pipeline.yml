name: Craver Fastfood Enterprise Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clone Restaurant code into cloud VM
        uses: actions/checkout@v4

      - name: 2. Gate 1: Code Sanity & File Integrigy Check
        run: | 
          echo "=== Running Gate 1: File Integrity checks ==="
          test -f index.html || (echo "ERROR: index.html missing!"&& exit 1 )
          test -f Dockerfile || (echo "ERROR: Dockerfile missing!" && exit 1 )
          echo "Gate 1 PASSED: Core files are healthy!"

      - name: 3. Build Docker Image in Cloud
        run: docker build -t craver-restaurant:latest . 



      - name: 4. Gate 2 : Trivy Continer Vulnerability Scan (CVEs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'craver-restaurant:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'


