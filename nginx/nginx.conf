# NGINX Reverse Proxy Configuration for Craver Fastfood
# This acts as our Dynamic Traffic Router between Blue and Green deployments.

events {
    # Handles worker connections (default is 1024)
    worker_connections 1024;
}

http {
    # The Upstream group defines our backend target.
    # In Step 1, it points to craver-blue.
    # During cutover, our pipeline changes this to craver-green and reloads NGINX.
    upstream restaurant_backend {
        server craver-blue:80;
    }

    server {
        listen 80;

        location / {
            # Pass all incoming public traffic directly to the current active backend
            proxy_pass http://restaurant_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
